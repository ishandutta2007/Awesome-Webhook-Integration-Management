<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1035" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <linearGradient id="line-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes dash-flow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes node-glow {
      0%, 100% { r: 6px; filter: drop-shadow(0 0 4px #8B5CF6); }
      50% { r: 9px; filter: drop-shadow(0 0 10px #EC4899); }
    }
    @keyframes pill-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .bg { fill: url(#bg-grad); }
    .ambient-glow { animation: pulse-slow 6s ease-in-out infinite; transform-origin: center; }
    .flow-line { stroke: url(#line-grad-1); stroke-width: 2.5; stroke-dasharray: 8 12; animation: dash-flow 8s linear infinite; }
    .node { animation: node-glow 3s ease-in-out infinite; }
    .pill-1 { animation: pill-float 4s ease-in-out infinite; }
    .pill-2 { animation: pill-float 5s ease-in-out 1s infinite; }
    .pill-3 { animation: pill-float 4.5s ease-in-out 2s infinite; }
  </style>

  <!-- Background -->
  <rect class="bg" width="900" height="280" rx="16" />
  
  <!-- Ambient Glow Behind Title -->
  <circle class="ambient-glow" cx="450" cy="140" r="240" fill="url(#glow)" />

  <!-- Dynamic Event Flow Visualizations (Background Network) -->
  <g opacity="0.45">
    <path class="flow-line" d="M 50 70 Q 250 20 450 70 T 850 70" fill="none" />
    <path class="flow-line" d="M 80 220 Q 300 260 520 210 T 820 220" fill="none" />
    <path class="flow-line" d="M 120 140 C 300 80, 600 200, 780 140" fill="none" />

    <!-- Animated Nodes -->
    <circle class="node" cx="120" cy="140" fill="#60A5FA" />
    <circle class="node" cx="320" cy="95" fill="#A78BFA" />
    <circle class="node" cx="580" cy="175" fill="#F472B6" />
    <circle class="node" cx="780" cy="140" fill="#34D399" />
  </g>

  <!-- Background Floating Tech Badges (Non-interfering) -->
  <g opacity="0.25">
    <g class="pill-1" transform="translate(60, 45)">
      <rect width="110" height="26" rx="13" fill="#374151" />
      <text x="55" y="17" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ WEBHOOKS</text>
    </g>
    <g class="pill-2" transform="translate(730, 45)">
      <rect width="110" height="26" rx="13" fill="#374151" />
      <text x="55" y="17" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🛡️ HMAC GATEWAY</text>
    </g>
    <g class="pill-3" transform="translate(720, 215)">
      <rect width="120" height="26" rx="13" fill="#374151" />
      <text x="60" y="17" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔄 RETRY QUEUES</text>
    </g>
  </g>

  <!-- FOREGROUND TEXT CONTAINER (Sharp, High-Contrast, Foreground Guaranteed) -->
  <g text-anchor="middle">
    <!-- Semi-transparent dark backing card behind text for maximum legibility -->
    <rect x="130" y="70" width="640" height="140" rx="16" fill="#0B0F19" fill-opacity="0.65" stroke="#374151" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Subtitle Badge -->
    <rect x="330" y="85" width="240" height="24" rx="12" fill="#1F2937" stroke="#4B5563" stroke-width="1" />
    <text x="450" y="101" fill="#60A5FA" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">PRODUCTION WEBHOOK INFRASTRUCTURE</text>

    <!-- Main Title -->
    <text x="450" y="145" fill="url(#text-grad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" letter-spacing="-0.5">
      Awesome Webhook Integration Management
    </text>

    <!-- Tagline Subtitle -->
    <text x="450" y="182" fill="#D1D5DB" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      Curated Ecosystem of Webhook SaaS Platforms, Open-Source Gateways &amp; Event Relays
    </text>
  </g>
</svg>
